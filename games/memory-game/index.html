<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Game | Paddington Helper Academy</title>
<style>
:root{--paper:#fff4d7;--ink:#3d2a1c;--blue:#234f70;--gold:#e5ad3e;--green:#4f7a4d;--red:#a74835}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#ead3a5,#775335);font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.shell{width:min(1200px,calc(100% - 24px));margin:12px auto;background:linear-gradient(100deg,#fff8e7,#f4dfb6);border:8px solid #72451f;border-radius:28px;box-shadow:0 20px 50px #321d10aa;overflow:hidden}.top{display:flex;align-items:center;gap:16px;padding:16px 22px;background:#173f5b;color:white}.back{color:#ffe099;text-decoration:none;font-weight:900}.top h1{margin:0;flex:1;font-family:Georgia,serif}.stars{display:flex;align-items:center;gap:8px;font-weight:900}.star{width:23px;height:23px;background:var(--gold);clip-path:polygon(50% 0,61% 34%,98% 35%,68% 57%,79% 94%,50% 72%,21% 94%,32% 57%,2% 35%,39% 34%)}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:13px;background:#d5b47b}.level{border:2px solid #79502b;border-radius:12px;background:#fff3d4;padding:9px 6px;font-weight:900;color:#603b1d;cursor:pointer;box-shadow:0 3px 0 #825025;transition:.2s}.level:hover:not(:disabled){transform:translateY(-3px)}.level.active{background:var(--blue);color:white}.level:disabled{opacity:.52;cursor:not-allowed}.stage{padding:22px;min-height:580px}.intro{text-align:center;margin-bottom:15px}.intro h2{font-family:Georgia,serif;color:var(--blue);font-size:30px;margin:0 0 5px}.intro p{margin:0;font-weight:700}.message{min-height:46px;margin:12px auto;padding:10px;border:2px solid #c7953c;border-radius:12px;background:#fff7df;text-align:center;font-weight:900;max-width:700px}.board{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px}.card{height:150px;border:0;background:none;perspective:900px;cursor:pointer}.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}.card.open .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:15px;border:4px solid #d39c3c;box-shadow:0 7px 12px #55351655;display:flex;align-items:center;justify-content:center}.front{background:linear-gradient(145deg,#285b7b,#16394f)}.front:after{content:"P";font:900 50px Georgia;color:#f3c45c;border:3px solid #f3c45c;border-radius:50%;width:68px;height:68px;display:grid;place-items:center}.rear{transform:rotateY(180deg);background:#fffaf0;padding:9px;font-weight:900;text-align:center}.picture{width:100%;height:100%;border-radius:9px;background:url("../../assets/vocabulary-3d-sprites.png") var(--x) var(--y)/400% 300% no-repeat}.quiz,.word-task{max-width:650px;margin:auto;text-align:center;background:#fff8e8;border:4px solid #d2a34f;border-radius:22px;padding:20px;box-shadow:0 10px 24px #55351644}.hero-picture{width:min(330px,100%);aspect-ratio:1.35;margin:0 auto 16px;border-radius:16px;background:url("../../assets/vocabulary-3d-sprites.png") var(--x) var(--y)/400% 300% no-repeat;box-shadow:0 7px 15px #55351655}.answers{display:grid;gap:10px}.answer,.letter{border:2px solid #bc8332;border-radius:10px;background:#ffe5a9;padding:11px;font-weight:900;cursor:pointer;transition:.18s}.answer:hover,.letter:hover{transform:translateY(-2px);background:#ffd572}.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px}.letter{min-width:45px;text-transform:uppercase}.built{min-height:50px;font:900 28px Georgia;letter-spacing:3px;border-bottom:3px dashed #bd873c;margin:15px}.typing{width:min(440px,90%);padding:12px;border:3px solid #b77e30;border-radius:12px;font-size:22px;text-align:center}.submit{display:block;margin:14px auto 0;border:0;border-radius:10px;background:var(--blue);color:white;padding:11px 28px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #102b3c}.complete{max-width:600px;margin:40px auto;text-align:center;padding:35px;background:#eef7df;border:5px solid var(--green);border-radius:24px}.complete h2{font:900 38px Georgia;color:#35603a}@media(max-width:760px){.levels{grid-template-columns:1fr}.level{display:none}.level.active{display:block}.board{grid-template-columns:repeat(3,1fr)}.card{height:125px}.stage{padding:12px}.top h1{font-size:20px}}@media(max-width:440px){.board{grid-template-columns:repeat(2,1fr)}}
</style><style>
body{background:radial-gradient(circle at 50% 0,#e8c98e,#684126)}.shell{background:linear-gradient(105deg,#fff9e9 0 49.4%,#d1aa6b 49.8% 50.2%,#f3ddb3 50.6%);border:10px solid #663817;border-radius:30px;box-shadow:0 8px 0 #3c200f,0 24px 55px #241207cc,inset 0 0 30px #9f682955}.level{background:linear-gradient(#fff1c9,#dcb875);font-family:Georgia,serif;text-shadow:0 1px #fff8;box-shadow:inset 0 2px #fff8,0 5px 0 #825025,0 8px 10px #5a341d55}.level.active{background:linear-gradient(#39779b,#173f5b);color:white;text-shadow:0 2px #102b3c;box-shadow:inset 0 2px #7eb1cb,0 5px 0 #0c293a,0 8px 12px #3b210f66}.intro h2{font-size:34px;text-shadow:0 2px #fff,0 4px 5px #75441f55}.card{height:170px;padding:0;perspective:1000px;filter:drop-shadow(0 9px 7px #5a351f55)}.card-inner{display:block;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.75,.25,1)}.face{-webkit-backface-visibility:hidden;border-radius:17px;border-width:5px;box-shadow:inset 0 3px #fff7,inset 0 -7px #6c3b1666,0 3px 0 #75421e;overflow:hidden}.front{background:linear-gradient(145deg,#3b7899,#173f5b 55%,#102b3d);transform:rotateY(0deg) translateZ(1px)}.rear{transform:rotateY(180deg) translateZ(1px);background:linear-gradient(145deg,#fffdf4,#ead1a0);font:900 20px Georgia,serif;text-shadow:0 1px white}.message{box-shadow:inset 0 2px #fff,0 5px 12px #70461f33}
</style></head><body><main class="shell"><header class="top"><a class="back" href="../../">Back to Academy</a><h1>Memory Game</h1><div class="stars"><span class="star"></span><span id="starCount">0</span></div></header><nav class="levels" id="levels"></nav><section class="stage"><div class="intro"><h2 id="levelTitle"></h2><p id="levelPurpose"></p></div><div class="message" id="message">Loading vocabulary...</div><div id="game"></div></section></main>
<script>
const levelInfo=[['Picture → Word','Match each picture with its English word.'],['Quiz','Choose the word that matches the picture.'],['Anagram','Put the letters in the correct order.'],['Missing letters','Choose the missing letter.'],['Type the word','Type the complete English word.']];
let vocabulary=[],level=1,unlocked=5,stars=0,round=0,score=0,lock=false,first=null,current=null,built='';
const game=document.querySelector('#game'),message=document.querySelector('#message'),levelTitle=document.querySelector('#levelTitle'),levelPurpose=document.querySelector('#levelPurpose'),starCount=document.querySelector('#starCount');
const shuffle=a=>[...a].sort(()=>Math.random()-.5); const pick=(n=1)=>shuffle(vocabulary).slice(0,n); const pos=n=>n===0?'0%':n===1?'33.333%':n===2?'66.666%':'100%';
function art(v,cls='hero-picture'){return `<div class="${cls}" style="--x:${pos(v.sprite[0])};--y:${v.sprite[1]*50}%" role="img" aria-label="${v.label}"></div>`}
function tone(ok=true){try{const a=new AudioContext,o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?660:210;g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.2);o.start();o.stop(a.currentTime+.2)}catch(e){}}
function say(text){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text))}}
function nav(){const host=document.querySelector('#levels');host.innerHTML=levelInfo.map((x,i)=>`<button class="level ${level===i+1?'active':''}" data-level="${i+1}" ${i+1>unlocked?'disabled':''}>Level ${i+1}<br>${x[0]}${i+1>unlocked?' — Locked':''}</button>`).join('');host.querySelectorAll('button:not(:disabled)').forEach(b=>b.onclick=()=>startLevel(+b.dataset.level));starCount.textContent=stars}
function startLevel(n){level=n;round=0;score=0;first=null;lock=false;levelTitle.textContent=`Level ${n}: ${levelInfo[n-1][0]}`;levelPurpose.textContent=levelInfo[n-1][1];message.textContent='Ready, Helper?';nav();({1:memory,2:quiz,3:anagram,4:missing,5:typing}[n])()}
function finish(){stars+=5;unlocked=Math.max(unlocked,Math.min(5,level+1));tone();game.innerHTML=`<div class="complete"><h2>Level complete!</h2><p>You earned 5 stars and unlocked the next challenge.</p><button class="submit" id="next">${level<5?'Next level':'Play again'}</button></div>`;message.textContent='Excellent English work!';nav();document.querySelector('#next').onclick=()=>startLevel(level<5?level+1:1)}
function memory(){const chosen=pick(6),deck=shuffle(chosen.flatMap(v=>[{v,type:'pic'},{v,type:'word'}]));game.className='board';game.innerHTML=deck.map((d,i)=>`<button class="card" data-id="${d.v.id}" data-type="${d.type}" aria-label="Card ${i+1}"><span class="card-inner"><span class="face front"></span><span class="face rear">${d.type==='pic'?art(d.v,'picture'):d.v.label}</span></span></button>`).join('');let matches=0;game.querySelectorAll('.card').forEach(c=>c.onclick=()=>{if(lock||c===first||c.classList.contains('matched'))return;c.classList.add('open');if(!first){first=c;return}lock=true;const ok=first.dataset.id===c.dataset.id&&first.dataset.type!==c.dataset.type;if(ok){tone();message.textContent='Great match!';setTimeout(()=>{first.classList.add('matched');c.classList.add('matched');first=null;lock=false;if(++matches===chosen.length)finish()},450)}else{message.textContent='Try another pair.';setTimeout(()=>{first.classList.remove('open');c.classList.remove('open');first=null;lock=false},750)}})}
function quiz(){game.className='';if(round===5)return finish();current=pick()[0];const choices=shuffle([current,...shuffle(vocabulary.filter(v=>v.id!==current.id)).slice(0,2)]);game.innerHTML=`<div class="quiz">${art(current)}<div class="answers">${choices.map(v=>`<button class="answer" data-id="${v.id}">${v.label}</button>`).join('')}</div></div>`;message.textContent=`Question ${round+1} of 5`;game.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(b.dataset.id===current.id){tone();say(current.word);round++;message.textContent='Great job!';setTimeout(quiz,500)}else{tone(false);message.textContent='Try again!'}})}
function anagram(){game.className='';if(round===5)return finish();current=pick()[0];built='';const chars=shuffle([...current.word.replaceAll(' ','')]);game.innerHTML=`<div class="word-task">${art(current)}<div class="built" id="built"></div><div class="letters">${chars.map((c,i)=>`<button class="letter" data-char="${c}" data-i="${i}">${c}</button>`).join('')}</div><button class="submit" id="clear">Clear</button></div>`;message.textContent=`Word ${round+1} of 5`;game.querySelectorAll('.letter').forEach(b=>b.onclick=()=>{b.disabled=true;built+=b.dataset.char;document.querySelector('#built').textContent=built.toUpperCase();if(built.length===current.word.replaceAll(' ','').length){if(built===current.word.replaceAll(' ','')){tone();round++;setTimeout(anagram,650)}else{tone(false);message.textContent='Try again!';setTimeout(anagram,700)}}});document.querySelector('#clear').onclick=anagram}
function missing(){game.className='';if(round===5)return finish();current=pick()[0];const word=current.word;let indexes=[...word].map((c,i)=>c!==' '?i:-1).filter(i=>i>=0),idx=indexes[Math.floor(Math.random()*indexes.length)],correct=word[idx],masked=[...word];masked[idx]='_';const pool='abcdefghijklmnopqrstuvwxyz'.split('').filter(c=>c!==correct);const options=shuffle([correct,...shuffle(pool).slice(0,2)]);game.innerHTML=`<div class="word-task">${art(current)}<div class="built">${masked.join('').toUpperCase()}</div><div class="answers">${options.map(c=>`<button class="answer" data-char="${c}">${c.toUpperCase()}</button>`).join('')}</div></div>`;message.textContent=`Word ${round+1} of 5`;game.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(b.dataset.char===correct){tone();round++;message.textContent='Correct letter!';setTimeout(missing,550)}else{tone(false);message.textContent='Try again!'}})}
function typing(){game.className='';if(round===5)return finish();current=pick()[0];game.innerHTML=`<div class="word-task">${art(current)}<input class="typing" id="typing" autocomplete="off" aria-label="Type the word"><button class="submit" id="check">Check answer</button></div>`;message.textContent=`Word ${round+1} of 5`;const check=()=>{const val=document.querySelector('#typing').value.trim().toLowerCase();if(val===current.word){tone();say(current.word);round++;message.textContent='Correct!';setTimeout(typing,550)}else{tone(false);message.textContent='Try again!'}};document.querySelector('#check').onclick=check;document.querySelector('#typing').onkeydown=e=>{if(e.key==='Enter')check()};document.querySelector('#typing').focus()}
fetch('../../data/vocabulary.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{vocabulary=data;startLevel(1)}).catch(()=>message.textContent='Vocabulary could not be loaded. Please open the game from a web server.');
</script></body></html>
